<style>
.gbar{display:none}
@media (max-width:900px),(max-height:560px){
  html.game-lock,html.game-lock body{overflow:hidden !important;overscroll-behavior:none}
  .gwrap{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;background:var(--theme,#fff);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .gbar{display:flex;flex:none;align-items:center;gap:.6rem;height:28px;padding:0 .6rem;font:600 13px system-ui,sans-serif;background:#12251b;color:#cfe0d6}
  .gbar a{color:#f3dfa3;text-decoration:none;box-shadow:none}
  .gbar span{flex:1;text-align:right;opacity:.7;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .gwrap>.gbox{flex:1 1 auto;min-height:0 !important;height:auto !important;width:auto !important;border:0 !important;border-radius:0 !important;margin:0 !important}
}
</style>
<script>(function(){var m=matchMedia('(max-width: 900px), (max-height: 560px)');function f(){document.documentElement.classList.toggle('game-lock',m.matches)}f();if(m.addEventListener)m.addEventListener('change',f);else m.addListener(f)})();</script>

<div class="gwrap"><div class="gbar"><a href="/">‹ All games</a><span>Charioteer</span></div><div class="ct gbox" id="ct">
  <canvas aria-label="Charioteer game"></canvas>
  <div class="ct-hud"><span id="ct-city"></span><span id="ct-want"></span><span class="sp"></span><span id="ct-time"></span><span id="ct-coins"></span><button id="ct-jobs" aria-label="Jobs">📜 Jobs</button><button id="ct-pause" aria-label="Pause">❚❚</button></div>
  <div class="ct-obj" id="ct-obj" hidden></div>
  <div class="ct-word" id="ct-word" aria-live="polite"></div>
  <div class="ct-pad"><button id="ct-run" aria-label="Run, or brake in a chariot">Run</button><button id="ct-act">Get in</button></div>
  <div class="ct-ov" id="ct-ov" hidden></div>
  <noscript>This game needs JavaScript.</noscript>
</div></div>
<p style="font-size:.8rem;color:var(--secondary);margin-top:.5rem">Keyboard: arrows or WASD to move, Shift to run (or brake), E to get in or out of a chariot, J for jobs, P pauses. Phone: drag to move or steer.</p>
